<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UXRay AI - Instant UI & UX Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Prevents FOUC (Flash of Unstyled Content)
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'primary': '#4F46E5',
              'primary-light': '#6366F1',
              'text-primary': '#111827',
              'text-secondary': '#6B7280',
              'accent-teal': '#14B8A6',
              'danger-bg': '#FFF8F8',
              'danger-border': '#FFDFDF',
              'danger-text': '#D72F2F',
              'orange': {
                100: '#FFF7ED',
                500: '#F97316',
                800: '#9A3412',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'pulse-glow': 'pulse-glow 4s ease-in-out infinite',
              'orbit': 'orbit 10s ease-in-out infinite',
              'orbit-reverse': 'orbit-reverse 15s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(5px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              'pulse-glow': {
                '0%, 100%': { boxShadow: '0 0 20px rgba(79, 70, 229, 0.4), 0 0 30px rgba(79, 70, 229, 0.3)', opacity: 0.8 },
                '50%': { boxShadow: '0 0 40px rgba(79, 70, 229, 0.6), 0 0 60px rgba(79, 70, 229, 0.5)', opacity: 1 },
              },
              orbit: {
                '0%': { transform: 'rotate(0deg) translateX(100px) rotate(0deg)', opacity: 0.7 },
                '50%': { transform: 'rotate(180deg) translateX(100px) rotate(-180deg)', opacity: 1 },
                '100%': { transform: 'rotate(360deg) translateX(100px) rotate(-360deg)', opacity: 0.7 },
              },
              'orbit-reverse': {
                '0%': { transform: 'rotate(0deg) translateX(130px) rotate(0deg)', opacity: 0.7 },
                '50%': { transform: 'rotate(-180deg) translateX(130px) rotate(180deg)', opacity: 1 },
                '100%': { transform: 'rotate(-360deg) translateX(130px) rotate(360deg)', opacity: 0.7 },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "jspdf": "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm",
    "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm"
  }
}
</script>
</head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
